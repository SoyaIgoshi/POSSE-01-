<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite カウンターアプリ</title>
  </head>
  <body>
    <div id="app">
      <div class="card">
        <h1>Vite Counter</h1>
        <div id="count" class="count-display">0</div>
        <div class="button-group">
          <button id="decrement" class="btn btn-sub">- 減らす</button>
          <button id="reset" class="btn btn-reset">リセット</button>
          <button id="increment" class="btn btn-add">+ 増やす</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
