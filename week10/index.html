<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Finder</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 独自カスタムCSS (cssフォルダ内) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 flex justify-center items-start">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6">
    <h1 class="text-xl font-bold text-slate-800 text-center mb-6">GitHub User Finder</h1>

    <!-- 検索フォーム -->
    <div class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="username-input" 
        placeholder="GitHubユーザー名を入力" 
        class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
      >
      <button 
        id="search-btn" 
        class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition duration-200 text-sm disabled:bg-indigo-300"
      >
        検索
      </button>
    </div>

    <!-- ローディング表示 -->
    <div id="loading" class="hidden text-center py-4 text-indigo-600 font-medium animate-pulse text-sm">
      読み込み中...
    </div>

    <!-- エラーメッセージ表示エリア -->
    <div id="error-message" class="hidden p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg text-center"></div>

    <!-- ユーザー情報カード -->
    <div id="user-card" class="hidden border-t border-slate-200 pt-6">
      <div class="flex flex-col items-center text-center">
        <!-- アバター画像 -->
        <img id="avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full border-2 border-indigo-500 mb-4 object-cover">
        
        <!-- 名前 -->
        <h2 id="name" class="text-lg font-bold text-slate-800"></h2>
        
        <!-- bio (自己紹介) -->
        <p id="bio" class="text-sm text-slate-600 mt-2 mb-4 leading-relaxed"></p>

        <!-- スタッツ -->
        <div class="grid grid-cols-2 gap-4 w-full bg-slate-50 p-3 rounded-lg my-2 text-center">
          <div>
            <p class="text-xs text-slate-500">フォロワー</p>
            <p id="followers" class="text-base font-bold text-slate-700">0</p>
          </div>
          <div>
            <p class="text-xs text-slate-500">公開リポジトリ</p>
            <p id="repos" class="text-base font-bold text-slate-700">0</p>
          </div>
        </div>

        <!-- プロフィールリンク -->
        <a 
          id="profile-link" 
          href="#" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="mt-4 inline-block w-full py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition duration-200 text-sm font-medium"
        >
          GitHubで見る
        </a>
      </div>
    </div>
  </div>

  <!-- JavaScriptファイル (jsフォルダ内) -->
  <script src="js/script.js"></script>
</body>
</html>
