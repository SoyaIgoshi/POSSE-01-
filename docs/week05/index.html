<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week05 POSSE課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="fixed top-0 w-full z-[9999] bg-lime-300 flex justify-between">
        <h2 class="font-bold text-2xl" href="#">帯広柏葉高等学校</h2>
        <nav class="flex justify-between text-xl gap-6 pr-4">

    </header>
    <main>
        <section>

            <h2 class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/4 font-bold text-5xl w-96 bg-lime-300/60">帯広柏葉高等学校</h2>
        </section>
        <section>
            <div>
                <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden">
                    <div class="bg-blue-100 h-32 flex items-center justify-center text-4xl">🌦️</div>
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-1">進学実績</h3>
                        <ul>
                            <li href="#" class="hover:text-blue-600">2026年度</li>

                            <li href="#" class="hover:text-blue-600">2024年度</li>

                </div>
                <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden">

                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-1">過去の入試情報</h3>
                        <ul>
                            <li href="#" class="hover:text-blue-600">2026年度</li>
                            <li href="#" class="hover:text-blue-600">2025年度</li>
                            <li href="#" class="hover:text-blue-600">2024年度</li>
                        </ul>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden">
                    <div class="bg-purple-100 h-32 flex items-center justify-center text-4xl">🛒</div>
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-1">行事日程</h3>
                        <p class="text-gray-500 text-sm hover:text-blue-600" href="#">行事日程表はこちらから</p>

                </div>
